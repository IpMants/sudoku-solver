name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  # Allow manually triggering the workflow from the Actions tab.
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the
# in-progress run and the latest queued one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` and plain `npm install` both hit npm's own "Exit handler
        # never called!" bug (npm/cli#7657 and related issues) deterministically
        # in this environment. Print the npm debug log after a failed attempt
        # so we can see the actual underlying cause instead of guessing.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            rm -rf node_modules
            npm install --no-audit --no-fund --loglevel verbose || true
            if [ -x node_modules/.bin/ng ]; then
              echo "Dependencies installed successfully (attempt $attempt/3)."
              exit 0
            fi
            echo "npm install did not produce a working install (attempt $attempt/3)."
            latest_log=$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -1)
            if [ -n "$latest_log" ]; then
              echo "----- Tail of $latest_log -----"
              tail -n 200 "$latest_log"
              echo "----- End of log tail -----"
            fi
            echo "Retrying in 10s..."
            sleep 10
          done
          echo "npm install failed to produce a working install after 3 attempts" >&2
          exit 1

      - name: Determine base href
        id: base-href
        shell: bash
        run: |
          # A "<owner>.github.io" repo is served from the domain root ("/"),
          # any other repo is served from "/<repo-name>/" (GitHub Pages
          # project-site convention), so the Angular router/base href must
          # match at build time.
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (production)
        run: npm run build -- --configuration production --base-href "${{ steps.base-href.outputs.value }}"

      - name: Add .nojekyll (preserve Angular's underscore-prefixed asset filenames)
        run: touch dist/sudoku-solver/browser/.nojekyll

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sudoku-solver/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
